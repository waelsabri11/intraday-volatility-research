[project]
name = "intraday-volatility-research"
version = "0.1.0"
description = "Intraday volatility forecasting with microstructure features and transaction costs"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "pyarrow>=15", "duckdb>=1.0", "arch>=7.0",
  "scikit-learn>=1.4", "torch>=2.2", "matplotlib>=3.8",
  "scipy>=1.12", "requests>=2.31",
]

[project.scripts]
ivr = "ivr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ivr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
